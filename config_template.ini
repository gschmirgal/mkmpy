[Database]
# false : télécharge les données et génère les CSV sans utiliser MySQL
enabled  = true
host     = 127.0.0.1
user     = mkmpy
password = your_password
database = mkmpy
port     = 3306

[Folders]
temp     = ./

[Logging]
# WARNING : n'affiche que les anomalies et erreurs (une exécution normale ne produit aucune sortie, pratique avec cron)
# INFO    : affiche aussi le déroulé complet (téléchargements, imports, matching)
level    = WARNING

[Browser]
# false : ne scrape pas la page Cardmarket des extensions (bloquée par Cloudflare depuis
# certains serveurs) ; les nouvelles extensions sont créées sous le nom "Unknown expansion <id>"
scrape_expansions = true
# chrome_version = 149
